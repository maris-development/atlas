[package]
name = "pyatlas"
version = "0.6.0"
edition = "2021"

[lib]
name = "_pyatlas"
crate-type = ["cdylib", "rlib"]

[dependencies]
atlas = { path = ".." }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
numpy = "0.28"
ndarray = "0.17"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
