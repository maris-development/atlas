site_name: Atlas
theme:
    name: material
    features:
        - navigation.expand
        - navigation.sections
        - navigation.top
        - content.code.copy
        - content.code.annotate
        - search.share
        - toc.follow
    palette:
        # Palette toggle for light mode
        - scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

        # Palette toggle for dark mode
        - scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

repo_url: https://github.com/robinskil/atlas
plugins:
    - search
    - mike:
          # These fields are all optional; the defaults are as below...
          alias_type: symlink
          redirect_template: null
          deploy_prefix: ""
          canonical_version: latest
          version_selector: true
          css_dir: css
          javascript_dir: js
    - mkdocstrings:
          handlers:
              python:
                  paths: ["python"] # python-source layout: package lives at python/pyatlas
                  options:
                      docstring_style: numpy
                      show_root_heading: true
                      show_source: false
                      members_order: source
                      separate_signature: true
                      show_signature_annotations: true
extra:
    version:
        provider: mike
        default: latest

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets

nav:
    - Home: index.md
    - Installation: installation.md
    - Quickstart: quickstart.md
    - vs Zarr / netCDF: vs-zarr-netcdf.md
    - Guides:
          - Datasets and arrays: guides/datasets-and-arrays.md
          - Durability and flushing: guides/durability.md
          - Codecs and metadata: guides/codecs-and-meta.md
          - Attributes: guides/attributes.md
          - Supported dtypes: guides/dtypes.md
          - xarray integration: guides/xarray.md
          - Dask streaming and lazy reads: guides/dask.md
          - Bulk reads: guides/bulk-reads.md
          - Stats and scans: guides/stats.md
          - Shared physical arrays: guides/shared-arrays.md
          - Cloud storage (S3, GCS, Azure): guides/cloud-storage.md
    - Examples: examples.md
    - Benchmarks: benchmarks.md
    - API reference:
          - Atlas: reference/atlas.md
          - DatasetView: reference/dataset-view.md
          - xarray accessor: reference/xarray-accessor.md
