[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atlas-python"
version = "0.16.1"
description = "Python bindings for the ATLAS array store"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Robin Kooyman", email = "robin.kooyman.work@gmail.com" }]
keywords = ["array", "ndarray", "xarray", "scientific", "storage", "object-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "xarray>=2023.1",
    "dask>=2023.1",
]

[project.urls]
Homepage = "https://github.com/maris-development/atlas"
Repository = "https://github.com/maris-development/atlas"
Issues = "https://github.com/maris-development/atlas/issues"

[project.scripts]
atlas = "atlas._cli:main"

[project.optional-dependencies]
# Tooling needed to run the test suite (`pytest atlas-python/tests`). The
# numpy/xarray/dask runtime deps come from `[project].dependencies`; this adds
# pytest and a netCDF backend (test_xarray reads a .nc fixture via xarray).
test = [
    "pytest",
    "netCDF4",
]
# Optional — installs the `obstore` Python package so that `Atlas.open` /
# `AtlasWriter.create` can accept an obstore-constructed S3 / GCS / Azure /
# HTTP store handle. The path-based local-fs API works without this.
cloud = [
    "obstore>=0.9",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "atlas._atlas"
python-source = "python"
