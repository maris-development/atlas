site_name: Atlas
theme:
    name: material
    features:
        - navigation.expand
        - navigation.sections
        - navigation.top
        - content.code.copy
        - content.code.annotate
        - search.share
        - toc.follow
    palette:
        # Palette toggle for light mode
        - scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

        # Palette toggle for dark mode
        - scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

repo_url: https://github.com/maris-development/atlas
plugins:
    - search
    - mike:
          # These fields are all optional; the defaults are as below...
          alias_type: symlink
          redirect_template: null
          deploy_prefix: ""
          canonical_version: latest
          version_selector: true
          css_dir: css
          javascript_dir: js
    - mkdocstrings:
          handlers:
              python:
                  paths: ["python"] # python-source layout: package lives at python/atlas
                  options:
                      # `init_tracing` is re-exported from the compiled Rust
                      # extension `atlas._atlas`. griffe can't analyse a .so
                      # statically, so import it to resolve the alias.
                      preload_modules: ["atlas._atlas"]
                      docstring_style: numpy
                      show_root_heading: true
                      show_source: false
                      members_order: source
                      separate_signature: true
                      show_signature_annotations: true
extra:
    version:
        provider: mike
        default: latest

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets

nav:
    - Home: index.md
    - Installation: installation.md
    - Quickstart: quickstart.md
    - The atlas command: cli.md
    - vs Zarr / netCDF: vs-zarr-netcdf.md
    - Guides:
          - Creating a collection: guides/creating.md
          - Inspecting a collection: guides/inspecting.md
          - Removing datasets: guides/removing.md
          - Supported dtypes: guides/dtypes.md
          - Reading data: guides/reading-data.md
          - Cloud storage (S3, GCS, Azure): guides/cloud-storage.md
    - Examples: examples.md
    - API reference: reference/api.md
