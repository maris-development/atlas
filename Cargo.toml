[workspace]
members = ["pyatlas"]

[package]
name = "atlas"
version = "0.2.1"
edition = "2024"

[dependencies]
array-format = { git = "https://github.com/robinskil/array-format" , version = "0.7.0" }
object_store = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = "0.17"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["fs", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
