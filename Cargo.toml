[workspace]
members = ["atlas-python"]

[package]
# Registry name on crates.io (`atlas` is taken). The library is still
# imported as `atlas` — see `[lib]` below.
name = "atlas-rust"
version = "0.16.1"
edition = "2024"
description = "Single-file immutable store for thousands of N-dimensional datasets, local or on object storage."
license = "Apache-2.0"
repository = "https://github.com/maris-development/atlas"
readme = "README.md"
keywords = ["array", "ndarray", "scientific", "storage", "object-store"]
categories = ["science", "data-structures", "filesystem"]

[lib]
name = "atlas"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Exact pin: the container format embeds this crate's files verbatim, so a
# change to its bytes is a change to the atlas format.
array-format = "=0.12.0"
object_store = "0.13"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
zstd = "0.13"
thiserror = "2"
ndarray = "0.17"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
