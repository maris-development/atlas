[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
array-format = { git = "https://github.com/robinskil/array-format" }
object_store = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = "0.16"
parking_lot = "0.12"
tokio = { version = "1", features = ["fs", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
